<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Listado de Insumos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 2rem;
        }
        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
        }
        .page-header h1 { font-size: 1.7rem; color: #1a365d; }
        .btn-group { display: flex; gap: 0.75rem; }
        .btn {
            padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.95rem;
            font-weight: 600; text-decoration: none; transition: opacity 0.2s; display: inline-block;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary   { background: #3182ce; color: white; }
        .btn-secondary { background: #e2e8f0; color: #2d3748; }
        .alert-success {
            background: #f0fff4; border: 1.5px solid #68d391; border-radius: 8px;
            padding: 0.8rem 1rem; color: #276749; margin-bottom: 1.2rem; font-size: 0.93rem;
        }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #2b6cb0; color: white; }
        thead th {
            padding: 1rem 1.2rem; text-align: left;
            font-size: 0.88rem; font-weight: 600; letter-spacing: 0.03em; white-space: nowrap;
        }
        tbody tr { border-bottom: 1px solid #edf2f7; transition: background 0.15s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #ebf8ff; }
        tbody td { padding: 0.85rem 1.2rem; color: #2d3748; font-size: 0.93rem; }
        .badge-num {
            background: #bee3f8; color: #2b6cb0;
            border-radius: 9999px; padding: 0.2rem 0.65rem;
            font-size: 0.8rem; font-weight: 700;
        }
        .badge-codigo {
            background: #e9d8fd; color: #553c9a;
            border-radius: 6px; padding: 0.2rem 0.5rem;
            font-size: 0.82rem; font-family: monospace;
        }
        .badge-activo {
            background: #c6f6d5; color: #276749;
            border-radius: 9999px; padding: 0.15rem 0.6rem;
            font-size: 0.8rem; font-weight: 600;
        }
        .empty-state { text-align: center; padding: 4rem 2rem; color: #a0aec0; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state p { font-size: 1.05rem; margin-bottom: 1.5rem; }
        .footer-nav { margin-top: 1.5rem; }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>📋 Listado de Insumos</h1>
        <div class="btn-group">
            <a th:href="@{/insumos/nuevo}" class="btn btn-primary">➕ Nuevo Insumo</a>
            <a th:href="@{/}"              class="btn btn-secondary">← Menú Principal</a>
        </div>
    </div>

    <!-- Flash de éxito tras guardar -->
    <div class="alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

    <div class="card">

        <!-- ── Tabla con insumos ────────────────────────────────────────── -->
        <table th:if="${not #lists.isEmpty(insumos)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Código Interno</th>
                    <th>Stock Actual</th>
                    <th>Precio USD</th>
                    <th>Valor Dólar Ref.</th>
                    <th>Precio ARS</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <!--
                    th:each itera la lista "insumos" (List<InsumoResponseDTO>) del modelo.
                    "stat" expone utilidades: stat.count numera las filas desde 1.
                -->
                <tr th:each="insumo, stat : ${insumos}">
                    <td><span class="badge-num" th:text="${stat.count}">1</span></td>
                    <td th:text="${insumo.nombre}">Nombre</td>
                    <td><span class="badge-codigo" th:text="${insumo.codigoInterno}">LUMI-0000</span></td>
                    <td th:text="${insumo.stockActual}">0</td>
                    <td th:text="'U$D ' + ${#numbers.formatDecimal(insumo.precioEnDolares, 1, 2)}">U$D 0.00</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(insumo.valorDolarReferencia, 1, 2)}">$0.00</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(insumo.precioEnPesos, 1, 2)}">$0.00</td>
                    <td>
                        <span class="badge-activo" th:if="${insumo.activo}">Activo</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- ── Lista vacía ─────────────────────────────────────────────── -->
        <div class="empty-state" th:if="${#lists.isEmpty(insumos)}">
            <div class="icon">📭</div>
            <p>No hay insumos registrados todavía.</p>
            <a th:href="@{/insumos/nuevo}" class="btn btn-primary">➕ Registrar el primero</a>
        </div>

    </div>

    <div class="footer-nav">
        <a th:href="@{/}" class="btn btn-secondary">← Volver al menú principal</a>
    </div>

</body>
</html>
