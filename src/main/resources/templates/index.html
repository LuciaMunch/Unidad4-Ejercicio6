<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sistema de Gestión de Insumos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hero { text-align: center; padding: 2rem; }
        .hero h1 { font-size: 2.4rem; color: #1a365d; margin-bottom: 0.5rem; }
        .hero p   { color: #4a5568; font-size: 1.05rem; margin-bottom: 2.5rem; }
        .card-grid { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem 2.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 220px;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.14); }
        .card .icon { font-size: 3rem; margin-bottom: 1rem; }
        .card h2 { font-size: 1.2rem; color: #2d3748; margin-bottom: 0.5rem; }
        .card p  { font-size: 0.9rem; color: #718096; }
        .card.primary { border-top: 4px solid #3182ce; }
        .card.success { border-top: 4px solid #38a169; }
        footer { margin-top: 3rem; color: #a0aec0; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>🏪 Sistema de Gestión de Insumos</h1>
        <p>Bienvenido al panel principal. Seleccioná una opción para continuar.</p>
        <div class="card-grid">
            <a th:href="@{/insumos/nuevo}" class="card primary">
                <div class="icon">➕</div>
                <h2>Registrar Insumo</h2>
                <p>Agregar un nuevo insumo al sistema</p>
            </a>
            <a th:href="@{/insumos}" class="card success">
                <div class="icon">📋</div>
                <h2>Ver Listado</h2>
                <p>Consultar todos los insumos registrados</p>
            </a>
        </div>
    </div>
    <footer>Sistema de Gestión &copy; 2025</footer>
</body>
</html>
