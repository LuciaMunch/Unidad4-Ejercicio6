# ─────────────────────────────────────────────────────────────────────────────
# Perfil de producción — se activa con SPRING_PROFILES_ACTIVE=prod
# Las variables de entorno se configuran en el dashboard de Render
# ─────────────────────────────────────────────────────────────────────────────

# Puerto (Render asigna el puerto via variable PORT)
server.port=${PORT:8080}

# ── Base de datos PostgreSQL ──────────────────────────────────────────────────
# En Render: Settings → Environment Variables
# DATABASE_URL tiene el formato:
#   postgresql://usuario:password@host:5432/nombre_db
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.example.inventario=INFO
logging.level.root=WARN
